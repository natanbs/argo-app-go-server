apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-app-go-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/natanbs/argo-app-go-server.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-ns
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
