apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-app-go-server
  namespace: apps-ns
  labels:
    app: argo-app-go-server
spec:
  ingressClassName: traefik
  rules:
  - host: argo-app-go-server.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argo-app-go-server
            port:
              number: 8080
