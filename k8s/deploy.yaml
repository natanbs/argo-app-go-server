apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-app-go-server
  namespace: apps-ns
  labels:
    app: argo-app-go-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argo-app-go-server
  template:
    metadata:
      labels:
        app: argo-app-go-server
    spec:
      containers:
      - name: argo-app-go-server
        image: floci-ecr-registry:5000/argo-app-go-server:v1.0.18
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: argo-app-go-server-env
            optional: true
        env:
        - name: IMAGE_TAG
          value: "v1.0.18"
        - name: PORT
          value: "8080"
        ports:
        - containerPort: 8080

        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5

